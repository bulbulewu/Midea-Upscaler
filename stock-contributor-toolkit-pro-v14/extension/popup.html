<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 14px;
         background: #f6f8fa; color: #1c2733; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { font-size: 11px; color: #67727e; margin: 0 0 10px; }
  label { font-size: 11px; font-weight: 600; color: #67727e; text-transform: uppercase;
          letter-spacing: .4px; display: block; margin: 10px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d5dce3;
          border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; border: none; border-radius: 8px; padding: 10px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  .primary { background: #0d9488; color: #fff; }
  .ghost { background: #e8edf2; color: #1c2733; }
  button:hover { filter: brightness(1.06); }
  #msg { font-size: 12px; color: #0d9488; margin-top: 8px; min-height: 16px; text-align: center; }
  .hint { font-size: 11px; color: #67727e; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>StockMeta Helper</h1>
  <p class="sub">Paste metadata from the Toolkit, then fill any upload page in one click.</p>
  <label>Title</label>
  <input id="title" maxlength="200" placeholder="Senior woman stretching on a quiet beach">
  <label>Description</label>
  <textarea id="desc" placeholder="One factual sentence…"></textarea>
  <label>Keywords (comma separated)</label>
  <textarea id="kws" placeholder="beach, sunrise, fitness, …"></textarea>
  <div class="row">
    <button class="ghost" id="save">Save</button>
    <button class="ghost" id="copy">Copy all</button>
  </div>
  <div class="row">
    <button class="primary" id="fill">Fill this upload page</button>
  </div>
  <div id="msg"></div>
  <p class="hint">Tip: generate metadata in the Toolkit's Metadata Studio, copy it here once,
     then re-use it across Adobe Stock and Shutterstock upload pages.</p>
  <script src="popup.js"></script>
</body>
</html>
